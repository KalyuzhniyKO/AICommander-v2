name: Foundation tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Update package installer
        run: python -m pip install --upgrade "pip>=26.2.1"
      - name: Install from README
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile backend
        run: python -m compileall backend
      - name: Test without live API access
        run: python -m pytest -q

  ui:
    name: Chromium owner panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Update package installer
        run: python -m pip install --upgrade "pip>=26.2.1"
      - name: Install UI dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser tests with temporary DB and mocked providers
        env:
          RUN_UI_TESTS: '1'
        run: python -m pytest -q tests/ui

  audit:
    name: Installed Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install audited application environment
        run: |
          python -m pip install --upgrade "pip>=26.2.1"
          python -m pip install -r requirements-ui.txt
          python -m pip check
      - name: Prepare separate audit tool
        run: |
          python -m venv .audit-tool
          .audit-tool/bin/python -m pip install --upgrade "pip>=26.2.1" "pip-audit==2.10.1"
      - name: Audit installed application packages (fail closed)
        shell: python
        run: |
          import subprocess
          import sysconfig
          subprocess.run([
              '.audit-tool/bin/python', '-I', '-m', 'pip_audit',
              '--path', sysconfig.get_path('purelib'), '--strict',
              '--format', 'json', '--output', 'dependency-audit.json',
              '--progress-spinner', 'off',
          ], check=True)
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
