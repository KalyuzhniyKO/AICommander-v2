<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AICommander 3.0</title><link rel="stylesheet" href="/style.css"/></head><body><main>
<header class="hero"><div><p class="eyebrow">v3 · Foundation MVP</p><h1>AICommander 3.0 — команда ИИ</h1><p>Здесь пока работает только текстовый MVP v2. Hermes, OmniRouter, Codex и настоящий QA добавляются по этапам.</p></div><div id="status" class="status">Готов к работе</div></header>
<section class="grid two">
<article class="card step"><h2>Поставить задачу</h2><textarea id="taskText" placeholder="Опиши требование"></textarea><button id="runTeam" class="primary">Запустить раунд</button></article>
<article class="card step"><h2>Уточнить задачу</h2><textarea id="commentText" placeholder="Комментарий владельца"></textarea><button id="runNext">Следующий раунд</button><label>Повторить роль <select id="roleSelect"><option>manager</option><option>architect</option><option>designer</option><option>coder</option><option>reviewer</option></select></label><button id="rerunRole">Повторить роль</button></article></section>
<section class="card"><h2>Результаты</h2><p id="roundMeta" class="meta"></p><div id="rounds"></div></section>
<section class="card"><h2>Статус моделей</h2><button id="checkModels">Проверить модели</button><button id="refreshModels">Обновить</button><pre id="models"></pre></section>
</main><script src="/app.js"></script></body></html>
